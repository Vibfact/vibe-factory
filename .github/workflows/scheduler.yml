# .github/workflows/scheduler.yml
# The only self-modifying piece: rewrites hot.yml's cron block from tomorrow's calendar.
# Handles DST, FOMC/CPI/NFP boosts, holidays, and 60-day inactivity keep-alive.
# Scheduled workflows are read from the default branch, so a push here takes effect immediately.
name: vibe-scheduler

on:
  schedule:
    - cron: "7 3 * * *"     # 05:07 CEST daily, after the Asia session, before London
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibe-scheduler
  cancel-in-progress: false

jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rewrite hot.yml schedule for tomorrow
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          python -m src.scheduler \
            --workflow .github/workflows/hot.yml \
            --marker-start ">>> MANAGED SCHEDULE START <<<" \
            --marker-end   ">>> MANAGED SCHEDULE END <<<" \
            --report state/next_day_plan.txt

      - name: Detect missed runs
        # Dropped scheduled runs leave no failed run behind, so check the gap explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python -m src.heartbeat --workflow hot.yml --max-gap-multiple 3

      - name: Commit new cadence
        run: |
          git config user.name  "vibe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/hot.yml state/next_day_plan.txt
          git diff --staged --quiet && echo "no cadence change" && exit 0
          git commit -m "cadence: $(date -u +%F) plan"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep $((i*5))
          done

      - name: Keep-alive touch
        # Guarantees repo activity even on days with no cadence change,
        # so GitHub never auto-disables the crons for 60-day inactivity.
        run: |
          date -u +'%FT%TZ' > state/heartbeat.txt
          git add state/heartbeat.txt
          git diff --staged --quiet || { git commit -m "heartbeat"; git push; }
