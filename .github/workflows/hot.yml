# .github/workflows/hot.yml
# PRESSURE track. Fast, cheap, stateless-ish: reads cache, polls fast sources, alerts on change.
# The schedule block between the MANAGED markers is rewritten nightly by scheduler.yml.
# Do not hand-edit inside the markers.
name: vibe-hot

on:
  # >>> MANAGED SCHEDULE START <<<
  schedule:
    # Belgian working day: every 5 min, 08:00-16:59 CEST (UTC+2).
    # DST: after 2026-10-25 change "6-14" to "7-15" for CET (UTC+1).
    - cron: '*/5 6-14 * * 1-5'
    # Evenings and overnight, hourly at :23
    - cron: '23 15-23,0-5 * * 1-5'
    # Weekends, every 4 hours
    - cron: '13 1,5,9,13,17,21 * * 6,0'  workflow_dispatch:
  # MANAGED SCHEDULE END
    inputs:
      dry_run:
        description: "Compute but do not send alerts"
        type: boolean
        default: false

permissions:
  contents: read          # hot runs never push; state lives in the Actions cache

concurrency:
  group: vibe-hot
  cancel-in-progress: true   # a delayed run must never queue behind the next one

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3       # hard stop; target runtime is under 45 s
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mutable-cache pattern: unique key per run, restored from the newest prefix match.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cache.json
            state/intraday.jsonl
            state/alert_log.json
          key: vibe-state-v2-${{ github.run_id }}
          restore-keys: |
            vibe-state-v2-

      - name: Poll and score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ARGENTOR_TOKEN: ${{ secrets.ARGENTOR_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python -m src.run --track pressure --budget-seconds 42

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/cache.json
            state/intraday.jsonl
            state/alert_log.json
          key: vibe-state-v2-${{ github.run_id }}
